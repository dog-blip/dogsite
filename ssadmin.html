<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>sealsense admin</title>
  
  <style>
    @import url(https://fonts.bunny.net/css2?family=Raleway);
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #4cff72;
      --green-dim: rgba(76,255,114,0.1);
      --red: #ff4444;
      --yellow: #ffcc00;
      --bg: #121212;
      --surface: #1c1c1c;
      --surface2: #242424;
      --border: rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.18);
      --text: #e0e0e0;
      --text-dim: #666;
      --text-mid: #999;
      --font: 'Raleway', sans-serif;
      --line-gradient: linear-gradient(to right, #ff871f, #2600ff, #00ff84, #ff871f);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      background-image:
        linear-gradient(rgba(25,25,25,0.4) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(25,25,25,0.4) 1.5px, transparent 1.5px);
      background-size: 4px 4px;
      background-position: -1px -1px;
    }

    /* ── Gradient top line ── */
    .gradient-line {
      position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 9999;
    }
    .gradient-line::before, .gradient-line::after {
      content: ""; position: absolute; width: 100%; height: 100%;
      background: var(--line-gradient); background-size: 200% 100%;
      animation: lineAnim 6s infinite linear;
    }
    .gradient-line::before { filter: blur(5px); }
    @keyframes lineAnim {
      0%   { background-position: 0 0; }
      25%  { background-position: 100% 0; }
      50%  { background-position: 0 0; }
      75%  { background-position: 100% 0; }
    }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .login-card {
      width: 380px; background: var(--surface);
      border: 1.9px solid var(--border); border-radius: 4px;
      padding: 40px; box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .login-logo {
      font-size: 32px; font-weight: 700; margin-bottom: 4px; text-align: center;
    }
    .login-logo span { color: var(--green); }
    .login-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 28px; text-align: center; }
    .login-label {
      font-size: 11px; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block;
    }
    .login-input {
      width: 100%; background: var(--bg); border: 1.9px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: var(--font);
      font-size: 14px; padding: 10px 14px; outline: none;
      transition: border-color 0.2s; margin-bottom: 16px;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .login-input:focus { border-color: var(--green); }
    .login-btn {
      width: 100%; background: transparent; border: 1.9px solid var(--green);
      color: var(--green); font-family: var(--font); font-size: 14px;
      font-weight: 700; padding: 11px; border-radius: 4px;
      cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
    }
    .login-btn:hover { background: var(--green-dim); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-err { margin-top: 12px; font-size: 12px; color: var(--red); text-align: center; min-height: 16px; }

    /* ── App shell ── */
    #app { display: none; flex-direction: column; height: 100vh; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 50px;
      background: var(--surface); border-bottom: 1.9px solid var(--border);
      flex-shrink: 0;
    }
    .header-logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .header-logo span { color: var(--green); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--green);
      background: var(--green-dim); border: 1.9px solid rgba(76,255,114,0.25);
      padding: 3px 10px; border-radius: 4px;
    }
    .logout-btn {
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      cursor: pointer; background: none; border: 1.9px solid var(--border);
      border-radius: 4px; padding: 4px 14px; transition: all 0.15s;
      font-family: var(--font); letter-spacing: 0.5px;
    }
    .logout-btn:hover { color: var(--red); border-color: var(--red); }

    .main-area { display: flex; flex: 1; overflow: hidden; }

    /* ── Nav ── */
    nav {
      width: 160px; flex-shrink: 0;
      background: var(--surface); border-right: 1.9px solid var(--border);
      padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 4px; cursor: pointer; color: var(--text-dim);
      font-size: 13px; font-weight: 600; transition: all 0.15s;
      border: 1.9px solid transparent; letter-spacing: 0.3px;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active {
      background: var(--green-dim); color: var(--green);
      border-color: rgba(76,255,114,0.2);
    }
    .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── Content ── */
    .content-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; padding: 24px; gap: 14px; }
    .panel.active { display: flex; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .panel-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .panel-title span { color: var(--green); }
    .panel-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Inputs & forms ── */
    .search-bar { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
    .search-input {
      flex: 1; background: var(--surface); border: 1.9px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: var(--font);
      font-size: 13px; padding: 8px 14px; outline: none;
      transition: border-color 0.2s;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .search-input:focus { border-color: var(--green); }
    .search-input::placeholder { color: var(--text-dim); }

    .form-row {
      display: flex; gap: 10px; flex-shrink: 0;
      background: var(--surface); border: 1.9px solid var(--border);
      border-radius: 4px; padding: 14px 16px; align-items: flex-end; flex-wrap: wrap;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 11px; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .form-input {
      background: var(--bg); border: 1.9px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: var(--font);
      font-size: 13px; padding: 7px 12px; outline: none;
      transition: border-color 0.2s; height: 34px;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .form-input:focus { border-color: var(--green); }
    .form-input.short { width: 80px; }
    .form-input.medium { width: 160px; }
    .form-input.flex { flex: 1; min-width: 140px; }

    /* ── Buttons ── */
    .btn {
      height: 34px; padding: 0 16px; border-radius: 4px; cursor: pointer;
      font-family: var(--font); font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px; transition: all 0.15s; border: 1.9px solid;
      flex-shrink: 0; text-transform: uppercase;
    }
    .btn-green { background: transparent; border-color: var(--green); color: var(--green); }
    .btn-green:hover { background: var(--green-dim); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text-mid); }
    .btn-outline:hover { border-color: var(--border-bright); color: var(--text); }
    .btn-red { background: transparent; border-color: var(--red); color: var(--red); }
    .btn-red:hover { background: rgba(255,68,68,0.1); }
    .btn-red:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-yellow { background: transparent; border-color: var(--yellow); color: var(--yellow); font-size: 11px; height: 28px; padding: 0 10px; }
    .btn-yellow:hover { background: rgba(255,204,0,0.1); }
    .btn-ghost {
      background: none; border: none; color: var(--text-dim); font-family: var(--font);
      font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 8px;
      letter-spacing: 0.3px; transition: color 0.15s;
    }
    .btn-ghost:hover { color: var(--text); }

    /* ── Table ── */
    .table-wrap { flex: 1; overflow-y: auto; border: 1.9px solid var(--border); border-radius: 4px; }
    .table-wrap::-webkit-scrollbar { width: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; background: var(--surface2); z-index: 1; }
    th {
      text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
      border-bottom: 1.9px solid var(--border); white-space: nowrap;
    }
    td {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      font-size: 13px; vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .col-key { font-family: monospace; font-size: 12px; color: var(--green); }
    .col-dim { color: var(--text-mid); font-size: 12px; }
    .action-cell { display: flex; gap: 6px; align-items: center; }
    .status-active { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .status-expired { color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .status-lifetime { color: var(--yellow); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

    /* ── Script editor ── */
    .editor-wrap { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .code-editor {
      flex: 1; background: var(--bg); border: 1.9px solid var(--border);
      border-radius: 4px; color: #a8ff78; font-family: monospace;
      font-size: 13px; padding: 14px; outline: none; resize: none;
      transition: border-color 0.2s; min-height: 0;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .code-editor:focus { border-color: var(--green); }
    .editor-meta { font-size: 11px; color: var(--text-dim); }

    /* ── Activity checkboxes ── */
    input[type=checkbox] { accent-color: var(--green); width: 14px; height: 14px; cursor: pointer; }
    .bulk-bar {
      display: none; align-items: center; gap: 12px; padding: 8px 14px;
      background: var(--green-dim); border: 1.9px solid rgba(76,255,114,0.2);
      border-radius: 4px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--green);
    }
    .bulk-bar.show { display: flex; }
    .btn-sm-red {
      background: transparent; border: 1.9px solid var(--red); color: var(--red);
      border-radius: 4px; font-family: var(--font); font-size: 10px; font-weight: 700;
      padding: 2px 8px; cursor: pointer; transition: background 0.15s;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .btn-sm-red:hover { background: rgba(255,68,68,0.1); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
      border-radius: 4px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
      letter-spacing: 0.3px;
    }
    #toast.show { opacity: 1; }
    #toast.success { background: var(--green-dim); border: 1.9px solid var(--green); color: var(--green); }
    #toast.error { background: rgba(255,68,68,0.12); border: 1.9px solid var(--red); color: var(--red); }
    #toast.info { background: var(--surface2); border: 1.9px solid var(--border-bright); color: var(--text); }

    /* ── Modals ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--surface); border: 1.9px solid var(--border);
      border-radius: 4px; padding: 28px; width: 420px;
      box-shadow: 0px 0px 3px -0.5px rgba(0,0,0,1) inset;
    }
    .modal-title {
      font-size: 16px; font-weight: 700; margin-bottom: 18px;
      letter-spacing: 0.5px; color: var(--text);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="gradient-line"></div>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">seal<span>sense</span></div>
    <div class="login-sub">admin</div>
    <div id="api-status" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;font-size:12px;font-weight:600;letter-spacing:0.5px;">
      <span id="api-dot" style="width:8px;height:8px;border-radius:50%;background:var(--text-dim);display:inline-block;flex-shrink:0;transition:background 0.3s;"></span>
      <span id="api-status-text" style="color:var(--text-dim)">Checking API...</span>
    </div>
    <label class="login-label" for="login-input">Admin Secret</label>
    <input class="login-input" type="password" id="login-input" placeholder="Enter secret..." autocomplete="current-password"/>
    <button class="login-btn" id="login-btn">Login</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-logo">seal<span>sense</span></div>
    <div class="header-right">
      <div class="header-badge">Admin</div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <div class="main-area">
    <nav>
      <div class="nav-item active" data-panel="keys">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Keys
      </div>
      <div class="nav-item" data-panel="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Activity
      </div>
      <div class="nav-item" data-panel="script">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Script
      </div>
    </nav>

    <div class="content-area">

      <!-- Keys panel -->
      <div class="panel active" id="panel-keys">
        <div class="panel-header">
          <div class="panel-title">seal<span>sense</span> keys</div>
          <div class="panel-actions">
            <button class="btn btn-outline" id="refresh-btn">Refresh</button>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Nick</label>
            <input class="form-input flex" type="text" id="new-nick" placeholder="Username"/>
          </div>
          <div class="form-group">
            <label>Days (0=∞)</label>
            <input class="form-input short" type="number" id="new-days" value="30" min="0"/>
          </div>
          <div class="form-group">
            <label>Custom Key</label>
            <input class="form-input medium" type="text" id="new-key" placeholder="Auto-generate"/>
          </div>
          <button class="btn btn-green" id="add-key-btn">+ Add Key</button>
        </div>
        <div class="search-bar">
          <input class="search-input" type="search" id="keys-search" placeholder="Search keys..."/>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Key</th><th>Nick</th><th>Expires</th><th>Time Left</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody id="keys-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Activity panel -->
      <div class="panel" id="panel-activity">
        <div class="panel-header">
          <div class="panel-title">activity <span>log</span></div>
          <div class="panel-actions">
            <button class="btn btn-outline" id="refresh-activity-btn">Refresh</button>
            <button class="btn btn-red" id="delete-all-btn">Delete All</button>
          </div>
        </div>
        <div class="search-bar">
          <input class="form-input" type="checkbox" id="select-all-cb" style="width:16px;height:16px;flex-shrink:0"/>
          <input class="search-input" type="search" id="activity-search" placeholder="Search logs..."/>
          <button class="btn btn-outline" id="deselect-all-btn">Deselect All</button>
        </div>
        <div class="bulk-bar" id="bulk-bar">
          <span id="bulk-count">0 selected</span>
          <button class="btn btn-red" style="height:28px;padding:0 12px;font-size:11px" id="delete-selected-btn">Delete Selected</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th style="width:36px"></th>
              <th>Key</th><th>Nick</th><th>IGN</th><th>IP</th><th>Time</th><th></th>
            </tr></thead>
            <tbody id="activity-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Script panel -->
      <div class="panel" id="panel-script">
        <div class="panel-header">
          <div class="panel-title">script <span>editor</span></div>
          <div class="panel-actions">
            <button class="btn btn-outline" id="load-script-btn">Load</button>
            <button class="btn btn-green" id="save-script-btn">Save</button>
          </div>
        </div>
        <div class="editor-wrap">
          <div class="editor-meta" id="editor-status">Load the script to edit it.</div>
          <textarea class="code-editor" id="core-editor" placeholder="// Load script to edit..."></textarea>
        </div>
      </div>

    </div><!-- content-area -->
  </div><!-- main-area -->
</div><!-- app -->

<div id="toast"></div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title">Edit Key</div>
    <div class="form-group" style="margin-bottom:14px">
      <label style="font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;display:block">Key</label>
      <input class="form-input" type="text" id="edit-key" style="width:100%;font-family:monospace;font-size:12px"/>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label style="font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;display:block">Name / Nick</label>
      <input class="form-input" type="text" id="edit-nick" style="width:100%"/>
    </div>
    <div class="form-group" style="margin-bottom:18px">
      <label style="font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;display:block">Days left (0 = lifetime)</label>
      <input class="form-input medium" type="number" id="edit-days" min="0"/>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="edit-cancel">Cancel</button>
      <button class="btn btn-green" style="height:32px;padding:0 14px;font-size:12px" id="edit-confirm">Save</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box">
    <div class="modal-title">Confirm Delete</div>
    <div style="color:var(--text-mid);font-size:13px;margin-bottom:20px" id="delete-modal-body"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="delete-cancel">Cancel</button>
      <button class="btn btn-red" style="height:32px;padding:0 14px;font-size:12px" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="confirm-title"></div>
    <div style="color:var(--text-mid);font-size:13px;margin-bottom:20px" id="confirm-body"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-red" style="height:32px;padding:0 14px;font-size:12px" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://seal.sealfr07.workers.dev';
  const SESSION_KEY = '_ss_admin_session';
  const SESSION_TTL = 24 * 60 * 60 * 1000;

  let ADMIN_SECRET = '';
  let allKeys = [];
  let allActivity = [];
  let selectedIds = new Set();

  // ── Session ───────────────────────────────────────────────────────────────
  function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify({ secret: s, ts: Date.now() })); }
  function loadSession() {
    try { const s = JSON.parse(localStorage.getItem(SESSION_KEY)); if (s?.secret && (Date.now()-s.ts) < SESSION_TTL) return s.secret; } catch {}
    return null;
  }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  // ── Auth ──────────────────────────────────────────────────────────────────
  const loginScreen = document.getElementById('login-screen');
  const appEl       = document.getElementById('app');
  const loginInput  = document.getElementById('login-input');
  const loginBtn    = document.getElementById('login-btn');
  const loginErr    = document.getElementById('login-err');

  // ── API health check ───────────────────────────────────────────────────────
  async function checkHealth() {
    const dot = document.getElementById('api-dot');
    const txt = document.getElementById('api-status-text');
    try {
      const r = await fetch(`${API}/api/health`);
      const data = await r.json();
      if (data.ok) {
        dot.style.background = 'var(--green)';
        dot.style.boxShadow = '0 0 6px var(--green)';
        txt.style.color = 'var(--green)';
        txt.textContent = 'API Online';
      } else {
        throw new Error('not ok');
      }
    } catch {
      dot.style.background = 'var(--red)';
      dot.style.boxShadow = '0 0 6px var(--red)';
      txt.style.color = 'var(--red)';
      txt.textContent = 'API Offline';
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  async function attemptLogin(secret) {
    if (!secret) { loginErr.textContent = 'Enter your password'; return; }
    loginBtn.textContent = 'Signing in…'; loginBtn.disabled = true;
    try {
      const r = await fetch(`${API}/admin/keys`, { headers: { 'x-admin-secret': secret } });
      if (r.status === 401) { loginErr.textContent = 'Invalid password'; loginBtn.textContent = 'Sign in'; loginBtn.disabled = false; clearSession(); return; }
      ADMIN_SECRET = secret; saveSession(secret);
      loginScreen.style.display = 'none'; appEl.style.display = 'flex';
      loginBtn.textContent = 'Sign in'; loginBtn.disabled = false;
      allKeys = (await r.json()).keys || []; renderKeys();
    } catch { loginErr.textContent = 'Connection failed'; loginBtn.textContent = 'Sign in'; loginBtn.disabled = false; }
  }

  loginBtn.addEventListener('click', () => attemptLogin(loginInput.value.trim()));
  loginInput.addEventListener('keydown', e => e.key === 'Enter' && attemptLogin(loginInput.value.trim()));
  document.getElementById('logout-btn').addEventListener('click', () => {
    ADMIN_SECRET = ''; clearSession();
    appEl.style.display = 'none'; loginScreen.style.display = 'flex';
    loginInput.value = ''; loginErr.textContent = '';
  });

  const savedSession = loadSession();
  if (savedSession) attemptLogin(savedSession);

  // ── Tabs ──────────────────────────────────────────────────────────────────
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      item.classList.add('active');
      document.getElementById('panel-' + item.dataset.panel).classList.add('active');
      if (item.dataset.panel === 'activity') fetchActivity();
    });
  });

  // ── Toast ─────────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(`${API}${path}`, opts);
    return r.json();
  }

  // ── Generic confirm modal ─────────────────────────────────────────────────
  function confirm(title, body) {
    return new Promise(resolve => {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-body').textContent = body;
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('show');
      const ok = document.getElementById('confirm-ok');
      const cancel = document.getElementById('confirm-cancel');
      const cleanup = (val) => { modal.classList.remove('show'); ok.replaceWith(ok.cloneNode(true)); cancel.replaceWith(cancel.cloneNode(true)); resolve(val); };
      document.getElementById('confirm-ok').addEventListener('click', () => cleanup(true));
      document.getElementById('confirm-cancel').addEventListener('click', () => cleanup(false));
    });
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtDate(iso) { if (!iso) return 'Lifetime'; return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  function fmtTimeLeft(iso) {
    if (!iso) return 'Lifetime';
    const ms = new Date(iso) - Date.now();
    if (ms <= 0) return 'Expired';
    const d = Math.ceil(ms/86400000);
    return d < 30 ? d+'d' : Math.floor(d/30)+'mo';
  }
  function fmtTimestamp(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) + ' ' +
           d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  function keyStatus(row) {
    if (!row.active) return ['Inactive','status-inactive'];
    if (row.expires_at && new Date(row.expires_at) < new Date()) return ['Expired','status-expired'];
    return ['Active','status-active'];
  }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Keys ──────────────────────────────────────────────────────────────────
  function renderKeys() {
    const q = document.getElementById('keys-search').value.trim().toLowerCase();
    const tbody = document.getElementById('keys-tbody');
    let rows = allKeys;
    if (q) rows = rows.filter(r => r.key.toLowerCase().includes(q) || (r.nick||'').toLowerCase().includes(q));
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">${q?'No results.':'No keys yet.'}</div></td></tr>`; return; }
    tbody.innerHTML = rows.map(row => {
      const [st,cls] = keyStatus(row);
      return `<tr>
        <td class="col-key">${esc(row.key)}</td>
        <td class="col-nick">${esc(row.nick||'—')}</td>
        <td class="col-dim">${fmtDate(row.expires_at)}</td>
        <td class="col-dim">${fmtTimeLeft(row.expires_at)}</td>
        <td class="${cls}">${st}</td>
        <td><div class="action-cell">
          <button class="btn btn-yellow" onclick="openEdit('${esc(row.key)}','${esc(row.nick||'')}',row.expires_at?Math.max(0,Math.round((new Date(row.expires_at)-Date.now())/86400000)):0)">Edit</button>
          <button class="btn btn-red" style="height:28px;padding:0 10px;font-size:11px" onclick="openDelete('${esc(row.key)}')">Delete</button>
        </div></td>
      </tr>`;
    }).join('');
  }
  document.getElementById('keys-search').addEventListener('input', renderKeys);
  async function fetchKeys() { const data = await api('GET','/admin/keys'); allKeys=data.keys||[]; renderKeys(); }
  document.getElementById('refresh-btn').addEventListener('click', fetchKeys);
  document.getElementById('add-key-btn').addEventListener('click', async () => {
    const nick = document.getElementById('new-nick').value.trim()||'User';
    const days = Number(document.getElementById('new-days').value)||0;
    const customKey = document.getElementById('new-key').value.trim()||undefined;
    const data = await api('POST','/admin/keys',{nick,days,key:customKey});
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    toast('Key created: '+data.key,'success');
    document.getElementById('new-nick').value=''; document.getElementById('new-days').value='30'; document.getElementById('new-key').value='';
    fetchKeys();
  });

  let pendingDelete=null;
  function openDelete(key) { pendingDelete=key; document.getElementById('delete-modal-body').textContent=`Delete "${key}"? This cannot be undone.`; document.getElementById('delete-modal').classList.add('show'); }
  document.getElementById('delete-cancel').addEventListener('click', ()=>document.getElementById('delete-modal').classList.remove('show'));
  document.getElementById('delete-confirm').addEventListener('click', async ()=>{
    document.getElementById('delete-modal').classList.remove('show');
    if (!pendingDelete) return;
    const data = await api('DELETE','/admin/keys/'+encodeURIComponent(pendingDelete));
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    toast('Key deleted','success'); fetchKeys(); pendingDelete=null;
  });

  let pendingEditKey=null;
  function openEdit(key, nick, days) {
    pendingEditKey = key;
    document.getElementById('edit-key').value = key;
    document.getElementById('edit-nick').value = nick || '';
    document.getElementById('edit-days').value = days || 0;
    document.getElementById('edit-modal').classList.add('show');
  }
  document.getElementById('edit-cancel').addEventListener('click', ()=>document.getElementById('edit-modal').classList.remove('show'));
  document.getElementById('edit-confirm').addEventListener('click', async ()=>{
    document.getElementById('edit-modal').classList.remove('show');
    if (!pendingEditKey) return;
    const newKey = document.getElementById('edit-key').value.trim();
    const nick = document.getElementById('edit-nick').value.trim();
    const days = Number(document.getElementById('edit-days').value);
    const data = await api('PATCH','/admin/keys/'+encodeURIComponent(pendingEditKey),{newKey, nick, days});
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    toast('Key updated!','success'); fetchKeys(); pendingEditKey=null;
  });

  // ── Activity ──────────────────────────────────────────────────────────────
  function updateBulkBar() {
    const bar = document.getElementById('bulk-bar');
    const count = selectedIds.size;
    document.getElementById('bulk-count').textContent = count;
    bar.classList.toggle('show', count > 0);
  }

  function renderActivity() {
    const q = document.getElementById('activity-search').value.trim().toLowerCase();
    const tbody = document.getElementById('activity-tbody');
    let rows = allActivity;
    if (q) rows = rows.filter(r =>
      (r.ingame_name||'').toLowerCase().includes(q) ||
      (r.key||'').toLowerCase().includes(q) ||
      (r.ip||'').toLowerCase().includes(q) ||
      (r.nick||'').toLowerCase().includes(q)
    );
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">${q?'No results.':'No activity yet.'}</div></td></tr>`; return; }

    // Build IP map for multi-IP detection
    const keyIPs = {};
    allActivity.forEach(r => { if (!keyIPs[r.key]) keyIPs[r.key]=new Set(); if(r.ip) keyIPs[r.key].add(r.ip); });

    tbody.innerHTML = rows.map(row => {
      const multiIP = keyIPs[row.key]?.size > 1;
      const checked = selectedIds.has(row.id);
      return `<tr class="${multiIP?'ip-diff':''} ${checked?'selected':''}" data-id="${row.id}">
        <td class="td-check"><input type="checkbox" class="row-cb" data-id="${row.id}" ${checked?'checked':''}></td>
        <td class="col-ts">${fmtTimestamp(row.logged_at)}</td>
        <td class="col-nick">${esc(row.nick||'—')}</td>
        <td class="col-ingame">${esc(row.ingame_name||'—')}</td>
        <td class="col-key">${esc(row.key)}</td>
        <td class="col-ip">${esc(row.ip||'—')}${multiIP?' <span style="color:var(--red);font-size:10px">⚠</span>':''}</td>
        <td><button class="btn-sm-red" onclick="deleteLog(${row.id})">Delete</button></td>
      </tr>`;
    }).join('');

    // Attach checkbox listeners
    tbody.querySelectorAll('.row-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = Number(cb.dataset.id);
        if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
        cb.closest('tr').classList.toggle('selected', cb.checked);
        updateSelectAllCb();
        updateBulkBar();
      });
    });
  }

  function updateSelectAllCb() {
    const cbs = document.querySelectorAll('.row-cb');
    const allChecked = cbs.length > 0 && [...cbs].every(c => c.checked);
    document.getElementById('select-all-cb').checked = allChecked;
    document.getElementById('select-all-cb').indeterminate = !allChecked && selectedIds.size > 0;
  }

  document.getElementById('select-all-cb').addEventListener('change', e => {
    const checked = e.target.checked;
    document.querySelectorAll('.row-cb').forEach(cb => {
      cb.checked = checked;
      const id = Number(cb.dataset.id);
      if (checked) selectedIds.add(id); else selectedIds.delete(id);
      cb.closest('tr').classList.toggle('selected', checked);
    });
    updateBulkBar();
  });

  document.getElementById('deselect-all-btn').addEventListener('click', () => {
    selectedIds.clear();
    document.querySelectorAll('.row-cb').forEach(cb => { cb.checked = false; cb.closest('tr').classList.remove('selected'); });
    document.getElementById('select-all-cb').checked = false;
    document.getElementById('select-all-cb').indeterminate = false;
    updateBulkBar();
  });

  document.getElementById('activity-search').addEventListener('input', renderActivity);

  async function fetchActivity() {
    const tbody = document.getElementById('activity-tbody');
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Loading…</div></td></tr>`;
    const data = await api('GET','/admin/activity');
    allActivity = data.activity || [];
    selectedIds.clear(); updateBulkBar();
    renderActivity();
  }
  document.getElementById('refresh-activity-btn').addEventListener('click', fetchActivity);

  // Delete single log
  async function deleteLog(id) {
    const ok = await confirm('Delete Log', 'Delete this log entry?');
    if (!ok) return;
    const data = await api('DELETE', `/admin/activity/${id}`);
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    selectedIds.delete(id);
    allActivity = allActivity.filter(r => r.id !== id);
    renderActivity(); updateBulkBar();
    toast('Log deleted','success');
  }

  // Delete selected
  document.getElementById('delete-selected-btn').addEventListener('click', async () => {
    if (!selectedIds.size) return;
    const ok = await confirm('Delete Selected', `Delete ${selectedIds.size} selected log${selectedIds.size>1?'s':''}?`);
    if (!ok) return;
    const data = await api('POST', '/admin/activity/delete-many', { ids: [...selectedIds] });
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    allActivity = allActivity.filter(r => !selectedIds.has(r.id));
    selectedIds.clear(); updateBulkBar();
    renderActivity();
    toast(`Deleted ${data.deleted} logs`,'success');
  });

  // Delete all
  document.getElementById('delete-all-btn').addEventListener('click', async () => {
    if (!allActivity.length) { toast('No logs to delete','info'); return; }
    const ok = await confirm('Delete All Logs', `Delete all ${allActivity.length} log entries? This cannot be undone.`);
    if (!ok) return;
    const data = await api('DELETE', '/admin/activity');
    if (data.error) { toast('Error: '+data.error,'error'); return; }
    allActivity = []; selectedIds.clear(); updateBulkBar();
    renderActivity();
    toast('All logs deleted','success');
  });

  // ── Script editor ─────────────────────────────────────────────────────────
  const editorStatus = document.getElementById('editor-status');
  const coreEditor   = document.getElementById('core-editor');
  const saveBtn      = document.getElementById('save-script-btn');

  document.getElementById('load-script-btn').addEventListener('click', async () => {
    editorStatus.className='editor-status saving'; editorStatus.textContent='— loading…';
    const data = await api('GET','/admin/script');
    if (data.error) { editorStatus.className='editor-status err'; editorStatus.textContent='— '+data.error; return; }
    coreEditor.value=data.content; saveBtn.style.display='';
    const lines=(data.content.match(/\n/g)||[]).length+1;
    editorStatus.className='editor-status ok'; editorStatus.textContent=`— ${lines} lines`;
  });

  saveBtn.addEventListener('click', async () => {
    editorStatus.className='editor-status saving'; editorStatus.textContent='— saving…';
    const data = await api('PUT','/admin/script',{content:coreEditor.value});
    if (data.error) { editorStatus.className='editor-status err'; editorStatus.textContent='— '+data.error; toast('Save failed','error'); return; }
    editorStatus.className='editor-status ok'; editorStatus.textContent='— saved ✓';
    toast('Script saved','success');
  });

  coreEditor.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey)&&e.key==='s') { e.preventDefault(); if(saveBtn.style.display!=='none') saveBtn.click(); }
    if (e.key==='Tab') { e.preventDefault(); const s=coreEditor.selectionStart; coreEditor.value=coreEditor.value.substring(0,s)+'  '+coreEditor.value.substring(coreEditor.selectionEnd); coreEditor.selectionStart=coreEditor.selectionEnd=s+2; }
  });
</script>
</body>
</html>
