<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>javascript calc ahh thing</title>
  <style>


  #wrong-questions-display {
  	text-align: left;
  	margin-top: 15px;
  	font-size: 14px;
  	max-height: 220px;
  	overflow-y: auto;
  	overflow-x: hidden;
  	background: #f8f9fa;
  	padding: 10px;
  	border-radius: 8px;
	}

    html, body {
  		overflow: hidden;
	}

	body {
  	font-family: Arial, sans-serif;
  	background: #f0f2f5;
  	display: flex;
  	justify-content: center;
  	align-items: center;
  	height: 100vh;
  	margin: 0;
	}
    #wrong-questions-display {
  text-align: left;
  margin-top: 15px;
  font-size: 14px;
  max-height: 220px;
  overflow-y: auto;
  overflow-x: hidden;
  background: #f8f9fa;
  padding: 10px;
  border-radius: 8px;
  overscroll-behavior: contain;
}

    .game-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 420px;
      text-align: center;
      position: relative;
    }

    .hidden {
      display: none;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 5px;
    }

    button:hover {
      background: #0056b3;
    }

    input[type="number"] {
      padding: 8px;
      font-size: 18px;
      width: 120px;
      text-align: center;
      margin-bottom: 15px;
    }

    .score-text {
      font-size: 24px;
      font-weight: bold;
      color: #28a745;
      margin-top: 15px;
    }

    #question-text {
      font-size: 22px;
      margin: 20px 0;
      line-height: 1.4;
    }

    #wrong-questions-display {
      text-align: left;
      margin-top: 15px;
      font-size: 14px;
      max-height: 220px;
      overflow-y: auto;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
    }

    .wrong-question {
      margin-bottom: 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    #secret-btn {
      position: fixed;
      top: 0;
      right: 0;
      width: 35px;
      height: 35px;
      opacity: 0;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: default;
      z-index: 9999;
    }

    #secret-panel {
      margin-top: 15px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    #secret-panel input {
      width: 120px;
    }
  </style>
</head>
<body>

  <button id="secret-btn" onclick="toggleSecretPanel()"></button>

  <div class="game-container">
    <div id="setup-screen">
      <h2>Choose Your Level</h2>
      <button onclick="startGame('easy')">Ages 5-7 Easy</button>
      <button onclick="startGame('medium')">Ages 8-10 Medium</button>
      <button onclick="startGame('hard')">Ages 11+ Hard</button>
      <button onclick="startGame('veryhard')" style="background:#6610f2;">Very Hard Questions</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <h3>Question <span id="question-num">1</span> of 10</h3>
      <div id="question-text"></div>
      <input type="number" id="answer-input" placeholder="?">
      <br>
      <button onclick="submitAnswer()">Submit Answer</button>
    </div>

    <div id="end-screen" class="hidden">
      <h2>Challenge Complete!</h2>
      <p>Click below to reveal your final score.</p>

      <button onclick="revealScore()">Show Score</button>

      <div id="score-display" class="hidden score-text"></div>
      <br>

      <button id="wrong-btn" class="hidden" onclick="showWrongQuestions()" style="background:#dc3545;">
        Show Wrong Questions
      </button>

      <button id="hide-wrong-btn" class="hidden" onclick="hideWrongQuestions()" style="background:#ffc107; color:black;">
        Hide Wrong Questions
      </button>

      <button id="restart-btn" class="hidden" onclick="resetGame()" style="background:#6c757d;">
        Play Again
      </button>

      <div id="wrong-questions-display" class="hidden"></div>
    </div>

    <div id="secret-panel" class="hidden">
      <h3>Secret Mode</h3>
      <p>Set the answer. Every generated question will equal this number.</p>

      <input type="number" id="secret-answer-input" placeholder="answer">
      <br>

      <button onclick="setSecretAnswer()" style="background:#6f42c1;">
        Set Answer
      </button>

      <button onclick="turnOffSecretMode()" style="background:#dc3545;">
        Turn Off
      </button>

      <p id="secret-status"></p>
    </div>
  </div>

  <script>
    let difficulty = 'easy';
    let currentQuestionNum = 1;
    let score = 0;
    let currentCorrectAnswer = 0;
    let currentQuestionText = "";
    let wrongQuestions = [];

    let secretMode = false;
    let secretAnswer = 0;

    document.getElementById('answer-input').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        submitAnswer();
      }
    });

    function startGame(selectedLevel) {
      difficulty = selectedLevel;
      currentQuestionNum = 1;
      score = 0;
      wrongQuestions = [];

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('end-screen').classList.add('hidden');

      document.getElementById('score-display').classList.add('hidden');
      document.getElementById('restart-btn').classList.add('hidden');
      document.getElementById('wrong-btn').classList.add('hidden');
      document.getElementById('hide-wrong-btn').classList.add('hidden');
      document.getElementById('wrong-questions-display').classList.add('hidden');
      document.getElementById('wrong-questions-display').innerHTML = "";

      generateQuestion();
    }

    function generateQuestion() {
      let num1, num2, num3, operator, questionString;
      const inputField = document.getElementById('answer-input');

      inputField.value = '';
      document.getElementById('question-num').innerText = currentQuestionNum;

      if (secretMode) {
        questionString = generateSecretEquation(secretAnswer);
        currentCorrectAnswer = secretAnswer;
      }

      else if (difficulty === 'easy') {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        operator = Math.random() > 0.5 ? '+' : '-';

        if (operator === '-' && num1 < num2) {
          [num1, num2] = [num2, num1];
        }

        currentCorrectAnswer = operator === '+' ? num1 + num2 : num1 - num2;
        questionString = `${num1} ${operator} ${num2} =`;
      }

      else if (difficulty === 'medium') {
        let choice = Math.floor(Math.random() * 3);

        if (choice === 0) {
          num1 = Math.floor(Math.random() * 50) + 10;
          num2 = Math.floor(Math.random() * 50) + 10;
          currentCorrectAnswer = num1 + num2;
          questionString = `${num1} + ${num2} =`;
        }

        else if (choice === 1) {
          num1 = Math.floor(Math.random() * 50) + 20;
          num2 = Math.floor(Math.random() * 20) + 1;
          currentCorrectAnswer = num1 - num2;
          questionString = `${num1} - ${num2} =`;
        }

        else {
          num1 = Math.floor(Math.random() * 10) + 1;
          num2 = Math.floor(Math.random() * 9) + 1;
          currentCorrectAnswer = num1 * num2;
          questionString = `${num1} × ${num2} =`;
        }
      }

      else if (difficulty === 'hard') {
        let choice = Math.floor(Math.random() * 3);

        if (choice === 0) {
          num1 = Math.floor(Math.random() * 16) + 12;
          num2 = Math.floor(Math.random() * 14) + 11;
          currentCorrectAnswer = num1 * num2;
          questionString = `${num1} × ${num2} =`;
        }

        else if (choice === 1) {
          num1 = Math.floor(Math.random() * 80) + 20;
          num2 = Math.floor(Math.random() * 11) + 3;
          num3 = Math.floor(Math.random() * 8) + 3;

          if (Math.random() > 0.5) {
            currentCorrectAnswer = num1 + (num2 * num3);
            questionString = `${num1} + ${num2} × ${num3} =`;
          } else {
            currentCorrectAnswer = num1 - (num2 * num3);
            questionString = `${num1} - ${num2} × ${num3} =`;
          }
        }

        else {
          num2 = Math.floor(Math.random() * 8) + 2;
          currentCorrectAnswer = Math.floor(Math.random() * 12) + 4;
          num3 = Math.floor(Math.random() * 30) + 5;
          num1 = (num2 * currentCorrectAnswer) + num3;

          questionString = `If ${num2}x + ${num3} = ${num1}, then x =`;
        }
      }

      else if (difficulty === 'veryhard') {
        questionString = generateVeryHardQuestion();
      }

      currentQuestionText = questionString;
      document.getElementById('question-text').innerText = questionString;
      inputField.focus();
    }

    function generateVeryHardQuestion() {
      const type = Math.floor(Math.random() * 5);

      if (type === 0) {
        // Kinetic energy: KE = 1/2mv²
        let mass = Math.floor(Math.random() * 9) + 2;
        let velocity = Math.floor(Math.random() * 8) + 2;

        currentCorrectAnswer = 0.5 * mass * velocity * velocity;

        return `A ball has a mass of ${mass} kg and moves at ${velocity} m/s. What is its kinetic energy in joules?`;
      }

      else if (type === 1) {
        // Change in gravitational potential energy: ΔGPE = mgh, using g = 10
        let mass = Math.floor(Math.random() * 9) + 2;
        let height = Math.floor(Math.random() * 12) + 2;
        let gravity = 10;

        currentCorrectAnswer = mass * gravity * height;

        return `An object of mass ${mass} kg is lifted by ${height} m. Using g = 10 N/kg, what is the change in gravitational potential energy?`;
      }

      else if (type === 2) {
        // Square roots
        let root = Math.floor(Math.random() * 20) + 5;
        let square = root * root;

        currentCorrectAnswer = root;

        return `What is √${square}?`;
      }

      else if (type === 3) {
        // Simultaneous linear equations
        let x = Math.floor(Math.random() * 10) + 1;
        let y = Math.floor(Math.random() * 10) + 1;

        let a = Math.floor(Math.random() * 5) + 1;
        let b = Math.floor(Math.random() * 5) + 1;
        let c = Math.floor(Math.random() * 5) + 1;
        let d = Math.floor(Math.random() * 5) + 1;

        let total1 = (a * x) + (b * y);
        let total2 = (c * x) + (d * y);

        currentCorrectAnswer = x;

        return `Solve the simultaneous linear equations. Find x: ${a}x + ${b}y = ${total1}, and ${c}x + ${d}y = ${total2}.`;
      }

      else {
        // Mixed hard algebra with square root
        let answer = Math.floor(Math.random() * 15) + 3;
        let root = Math.floor(Math.random() * 10) + 2;
        let square = root * root;
        let multiplier = Math.floor(Math.random() * 6) + 2;
        let total = (multiplier * answer) + root;

        currentCorrectAnswer = answer;

        return `If ${multiplier}x + √${square} = ${total}, what is x?`;
      }
    }

    function generateSecretEquation(answer) {
      if (difficulty === 'easy') {
        let a = Math.floor(Math.random() * 10) + 1;
        let b = answer - a;
        return `${a} + ${b} =`;
      }

      else if (difficulty === 'medium') {
        let divisor = Math.floor(Math.random() * 9) + 2;
        let total = answer * divisor;
        return `${total} ÷ ${divisor} =`;
      }

      else if (difficulty === 'hard') {
        let m = Math.floor(Math.random() * 8) + 2;
        let c = Math.floor(Math.random() * 20) + 1;
        let total = (m * answer) + c;
        return `If ${m}x + ${c} = ${total}, then x =`;
      }

      else if (difficulty === 'veryhard') {
        let type = Math.floor(Math.random() * 4);

        if (type === 0) {
          let mass = 2;
          let velocitySquared = answer;
          return `A particle has mass ${mass} kg. If its kinetic energy is ${answer} J, what number is being used as the answer in this secret question?`;
        }

        else if (type === 1) {
          let rootSquare = answer * answer;
          return `What is √${rootSquare}?`;
        }

        else if (type === 2) {
          let m = Math.floor(Math.random() * 6) + 2;
          let c = Math.floor(Math.random() * 20) + 1;
          let total = (m * answer) + c;
          return `If ${m}x + ${c} = ${total}, what is x?`;
        }

        else {
          let y = Math.floor(Math.random() * 8) + 1;
          let a = 2;
          let b = 3;
          let c = 4;
          let d = 1;

          let total1 = (a * answer) + (b * y);
          let total2 = (c * answer) + (d * y);

          return `Solve the simultaneous linear equations. Find x: ${a}x + ${b}y = ${total1}, and ${c}x + ${d}y = ${total2}.`;
        }
      }
    }

    function submitAnswer() {
      const userAnswer = parseInt(document.getElementById('answer-input').value);

      if (isNaN(userAnswer)) {
        alert("Please type a number first!");
        return;
      }

      if (userAnswer === currentCorrectAnswer) {
        score++;
      } else {
        wrongQuestions.push({
          questionNumber: currentQuestionNum,
          question: currentQuestionText,
          userAnswer: userAnswer,
          correctAnswer: currentCorrectAnswer
        });
      }

      if (currentQuestionNum < 10) {
        currentQuestionNum++;
        generateQuestion();
      } else {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
      }
    }

    function revealScore() {
      const scoreDiv = document.getElementById('score-display');

      scoreDiv.innerText = `You scored ${score} / 10!`;
      scoreDiv.classList.remove('hidden');

      document.getElementById('restart-btn').classList.remove('hidden');

      if (wrongQuestions.length > 0) {
        document.getElementById('wrong-btn').classList.remove('hidden');
      }
    }

    function showWrongQuestions() {
      const wrongDisplay = document.getElementById('wrong-questions-display');

      if (wrongQuestions.length === 0) {
        wrongDisplay.innerHTML = "<p>You got everything correct!</p>";
      } else {
        wrongDisplay.innerHTML = "<h3>Questions You Got Wrong:</h3>";

        wrongQuestions.forEach(item => {
          wrongDisplay.innerHTML += `
            <div class="wrong-question">
              <strong>Question ${item.questionNumber}:</strong> ${item.question}<br>
              Your answer: ${item.userAnswer}<br>
              Correct answer: ${item.correctAnswer}
            </div>
          `;
        });
      }

      wrongDisplay.classList.remove('hidden');
      document.getElementById('hide-wrong-btn').classList.remove('hidden');
      document.getElementById('wrong-btn').classList.add('hidden');
    }

    function hideWrongQuestions() {
      document.getElementById('wrong-questions-display').classList.add('hidden');
      document.getElementById('hide-wrong-btn').classList.add('hidden');

      if (wrongQuestions.length > 0) {
        document.getElementById('wrong-btn').classList.remove('hidden');
      }
    }

    function toggleSecretPanel() {
      document.getElementById('secret-panel').classList.toggle('hidden');
    }

    function setSecretAnswer() {
      const value = parseInt(document.getElementById('secret-answer-input').value);

      if (isNaN(value)) {
        alert("Type a number first!");
        return;
      }

      secretAnswer = value;
      secretMode = true;

      document.getElementById('secret-status').innerText =
        `Secret mode on. Every question now has the answer ${secretAnswer}.`;

      if (!document.getElementById('quiz-screen').classList.contains('hidden')) {
        generateQuestion();
      }
    }

    function turnOffSecretMode() {
      secretMode = false;
      document.getElementById('secret-status').innerText = "Secret mode off.";

      if (!document.getElementById('quiz-screen').classList.contains('hidden')) {
        generateQuestion();
      }
    }

    function resetGame() {
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');

      document.getElementById('score-display').classList.add('hidden');
      document.getElementById('restart-btn').classList.add('hidden');
      document.getElementById('wrong-btn').classList.add('hidden');
      document.getElementById('hide-wrong-btn').classList.add('hidden');
      document.getElementById('wrong-questions-display').classList.add('hidden');
      document.getElementById('wrong-questions-display').innerHTML = "";

      currentQuestionNum = 1;
      score = 0;
      currentCorrectAnswer = 0;
      currentQuestionText = "";
      wrongQuestions = [];
    }
  </script>
</body>
</html>
